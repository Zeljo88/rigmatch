name: Deploy RigMatch App to Azure

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: rigmatch-azure-app-deploy
  cancel-in-progress: true

env:
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  RIGMATCH_NAME_PREFIX: ${{ vars.RIGMATCH_NAME_PREFIX || 'rigmatch' }}
  POSTGRES_ADMIN_USERNAME: ${{ vars.POSTGRES_ADMIN_USERNAME || 'rigmatchadmin' }}
  POSTGRES_DATABASE_NAME: ${{ vars.POSTGRES_DATABASE_NAME || 'rigmatch' }}
  AZURE_OPENAI_DEPLOYMENT_NAME: ${{ vars.AZURE_OPENAI_DEPLOYMENT_NAME }}
  AZURE_INFRA_DEPLOYMENT_NAME: ${{ vars.AZURE_INFRA_DEPLOYMENT_NAME || 'main' }}
  DOTNET_VERSION: '9.0.x'
  NODE_VERSION: '20'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Load infrastructure deployment outputs
        id: infra
        shell: bash
        run: |
          deployment_json="$(az deployment group show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_INFRA_DEPLOYMENT_NAME" \
            --output json)"

          echo "$deployment_json" > deployment.json

          web_app_name="$(jq -r '.properties.outputs.webAppName.value // empty' deployment.json)"
          web_app_url="$(jq -r '.properties.outputs.webAppUrl.value // empty' deployment.json)"
          static_web_app_name="$(jq -r '.properties.outputs.staticWebAppName.value // empty' deployment.json)"
          static_web_app_url="$(jq -r '.properties.outputs.staticWebAppUrl.value // empty' deployment.json)"
          storage_account_name="$(jq -r '.properties.outputs.storageAccountName.value // empty' deployment.json)"
          blob_container_name="$(jq -r '.properties.outputs.blobContainerName.value // empty' deployment.json)"
          app_insights_connection_string="$(jq -r '.properties.outputs.appInsightsConnectionString.value // empty' deployment.json)"
          postgres_fqdn="$(jq -r '.properties.outputs.postgresFullyQualifiedDomainName.value // empty' deployment.json)"
          postgres_db_name="$(jq -r '.properties.outputs.postgresDatabaseName.value // empty' deployment.json)"

          for value in \
            "$web_app_name" \
            "$web_app_url" \
            "$static_web_app_name" \
            "$static_web_app_url" \
            "$storage_account_name" \
            "$blob_container_name" \
            "$app_insights_connection_string" \
            "$postgres_fqdn"; do
            if [ -z "$value" ]; then
              echo "Missing required infrastructure output. Re-run infra deployment workflow first."
              exit 1
            fi
          done

          if [ -z "$postgres_db_name" ]; then
            postgres_db_name="$POSTGRES_DATABASE_NAME"
          fi

          echo "web_app_name=$web_app_name" >> "$GITHUB_OUTPUT"
          echo "web_app_url=$web_app_url" >> "$GITHUB_OUTPUT"
          echo "static_web_app_name=$static_web_app_name" >> "$GITHUB_OUTPUT"
          echo "static_web_app_url=$static_web_app_url" >> "$GITHUB_OUTPUT"
          echo "storage_account_name=$storage_account_name" >> "$GITHUB_OUTPUT"
          echo "blob_container_name=$blob_container_name" >> "$GITHUB_OUTPUT"
          echo "app_insights_connection_string=$app_insights_connection_string" >> "$GITHUB_OUTPUT"
          echo "postgres_fqdn=$postgres_fqdn" >> "$GITHUB_OUTPUT"
          echo "postgres_db_name=$postgres_db_name" >> "$GITHUB_OUTPUT"

      - name: Configure API app settings
        shell: bash
        run: |
          storage_connection_string="$(az storage account show-connection-string \
            --name "${{ steps.infra.outputs.storage_account_name }}" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query connectionString \
            --output tsv)"

          postgres_connection_string="Host=${{ steps.infra.outputs.postgres_fqdn }};Database=${{ steps.infra.outputs.postgres_db_name }};Username=${POSTGRES_ADMIN_USERNAME};Password=${{ secrets.POSTGRES_ADMIN_PASSWORD }};Ssl Mode=Require;Trust Server Certificate=true"

          az webapp config appsettings set \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "${{ steps.infra.outputs.web_app_name }}" \
            --settings \
              ASPNETCORE_ENVIRONMENT=Production \
              WEBSITE_RUN_FROM_PACKAGE=1 \
              APPLICATIONINSIGHTS_CONNECTION_STRING="${{ steps.infra.outputs.app_insights_connection_string }}" \
              ConnectionStrings__DefaultConnection="$postgres_connection_string" \
              Jwt__Issuer=RigMatch.Api \
              Jwt__Audience=RigMatch.Frontend \
              Jwt__SigningKey="${{ secrets.JWT_SIGNING_KEY }}" \
              FileStorage__Provider=AzureBlob \
              FileStorage__ContainerName="${{ steps.infra.outputs.blob_container_name }}" \
              FileStorage__ConnectionString="$storage_connection_string" \
              CvParsing__UseMockInDevelopment=false \
              CvParsing__Endpoint="${{ secrets.AZURE_OPENAI_ENDPOINT }}" \
              CvParsing__ApiKey="${{ secrets.AZURE_OPENAI_API_KEY }}" \
              CvParsing__DeploymentName="${AZURE_OPENAI_DEPLOYMENT_NAME}" \
              CvParsing__ApiVersion=2024-10-21 \
              Cors__AllowedOrigins__0="${{ steps.infra.outputs.static_web_app_url }}"

      - name: Publish API
        shell: bash
        run: |
          dotnet publish backend/RigMatch.Api.csproj -c Release -o backend/publish
          cd backend/publish
          zip -r ../../backend-api.zip .

      - name: Deploy API package
        shell: bash
        run: |
          az webapp deploy \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "${{ steps.infra.outputs.web_app_name }}" \
            --src-path backend-api.zip \
            --type zip \
            --async true

      - name: Wait for API health endpoint
        shell: bash
        run: |
          api_health_url="${{ steps.infra.outputs.web_app_url }}/health"

          for attempt in $(seq 1 36); do
            status_code="$(curl -s -o /dev/null -w "%{http_code}" "$api_health_url" || true)"

            if [ "$status_code" = "200" ]; then
              echo "API is healthy at $api_health_url"
              exit 0
            fi

            echo "Attempt $attempt/36: health check returned HTTP $status_code"
            sleep 10
          done

          echo "API did not become healthy within 6 minutes: $api_health_url"
          exit 1

      - name: Install frontend dependencies
        working-directory: frontend
        shell: bash
        run: npm ci

      - name: Set frontend production API URL
        shell: bash
        run: |
          sed -i "s|__API_BASE_URL__|${{ steps.infra.outputs.web_app_url }}|g" frontend/src/environments/environment.production.ts

      - name: Build frontend
        working-directory: frontend
        shell: bash
        run: npm run build -- --configuration production

      - name: Fetch Static Web Apps deployment token
        id: swa-token
        shell: bash
        run: |
          token="$(az staticwebapp secrets list \
            --name "${{ steps.infra.outputs.static_web_app_name }}" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query properties.apiKey \
            --output tsv)"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Deploy frontend
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.swa-token.outputs.token }}
          action: upload
          app_location: frontend/dist/frontend/browser
          skip_app_build: true
